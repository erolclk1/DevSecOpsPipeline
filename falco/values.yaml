# Source: falcosecurity/charts falco-9.1.0/values.yaml
# Falco Phase 5 configuration

driver:
  kind: modern_ebpf

tty: true

falco:
  json_output: true

  file_output:
    enabled: true
    keep_alive: false
    filename: /var/log/falco/events.log

mounts:
  volumes:
    - name: falco-logs
      hostPath:
        path: /var/log/falco
        type: DirectoryOrCreate

  volumeMounts:
    - name: falco-logs
      mountPath: /var/log/falco

collectors:
  kubernetes:
    enabled: true

falcosidekick:
  enabled: true

  webui:
    enabled: true

customRules:
  custom-rules.yaml: |-
    # Scope: only the vulnerable demo app. Self-contained where practical.

    - macro: in_demoapp
      condition: (k8s.ns.name = "demoapp" or container.image.repository endswith "/demoapp")

    - list: reverse_shell_tools
      items: [nc, ncat, netcat, socat, nmap]

    - list: local_shells
      items: [sh, bash, ash, dash, busybox]

    - list: web_runtimes
      items: [node, nodejs, python, python3]

    - list: demo_sensitive_files
      items: [/etc/shadow, /etc/sudoers]

    - list: pkg_mgmt
      items: [apk, apt, apt-get, dpkg, npm, pip, pip3, yum, dnf]

    # ─────────────────────────────────────────────────────────────────────
    # 1a. Reverse-shell: network tool spawned
    # ─────────────────────────────────────────────────────────────────────

    - rule: Reverse Shell Tool in demoapp
      desc: Netcat/socat-style tool launched inside the demo app container
      condition: >
        spawned_process
        and in_demoapp
        and proc.name in (reverse_shell_tools)
      output: "Reverse-shell tool in demoapp (cmd=%proc.cmdline parent=%proc.pname ns=%k8s.ns.name pod=%k8s.pod.name)"
      priority: CRITICAL
      tags: [demo, T1059]

    # ─────────────────────────────────────────────────────────────────────
    # 1b. Reverse-shell: stdio redirected to network
    # ─────────────────────────────────────────────────────────────────────

    - rule: Stdio to Network in demoapp
      desc: A process redirected stdin/stdout/stderr to a network socket
      condition: >
        in_demoapp
        and evt.type in (dup, dup2, dup3)
        and fd.num in (0,1,2)
        and fd.type in (ipv4, ipv6)
      output: "Stdio redirected to network in demoapp (conn=%fd.name cmd=%proc.cmdline ns=%k8s.ns.name)"
      priority: CRITICAL
      tags: [demo, T1059]

    # ─────────────────────────────────────────────────────────────────────
    # 2. Shell spawned by web application
    # ─────────────────────────────────────────────────────────────────────

    - rule: Shell Spawned by Web App in demoapp
      desc: Shell spawned by the Node.js/Python web process or its command shell
      condition: >
        spawned_process
        and in_demoapp
        and proc.name in (local_shells)
        and (
          proc.pname in (web_runtimes)
          or proc.pname in (local_shells)
        )
      output: "Shell spawned by web runtime (shell=%proc.name parent=%proc.pname cmd=%proc.cmdline ns=%k8s.ns.name)"
      priority: CRITICAL
      tags: [demo, T1059]

    # ─────────────────────────────────────────────────────────────────────
    # 3. Read sensitive file
    #
    # Detect the open attempt itself. This is important because the demo
    # container runs as uid 1000 and /etc/shadow returns Permission denied.
    # ─────────────────────────────────────────────────────────────────────

    - rule: Read Sensitive File in demoapp
      desc: Credential/sensitive file open attempt in the demo app
      condition: >
        evt.type in (open, openat, openat2)
        and evt.dir = <
        and in_demoapp
        and (
          fd.name in (demo_sensitive_files)
          or fd.name startswith /etc/sudoers.d
          or fd.name contains ".ssh/"
        )
      output: "Sensitive file opened in demoapp (file=%fd.name proc=%proc.cmdline ns=%k8s.ns.name)"
      priority: WARNING
      tags: [demo, T1552]

    # ─────────────────────────────────────────────────────────────────────
    # 4. Package management inside container
    # ─────────────────────────────────────────────────────────────────────

    - rule: Package Management in demoapp
      desc: Package manager executed at runtime
      condition: >
        spawned_process
        and in_demoapp
        and proc.name in (pkg_mgmt)
      output: "Package management in demoapp (cmd=%proc.cmdline ns=%k8s.ns.name)"
      priority: WARNING
      tags: [demo, T1072]

    # ─────────────────────────────────────────────────────────────────────
    # 5. Contact Kubernetes API server
    # ─────────────────────────────────────────────────────────────────────

    - macro: demo_outbound
      condition: >
        (evt.type = connect and evt.dir = < and fd.type in (ipv4))

    - rule: Contact K8s API Server from demoapp
      desc: demoapp pod connected to the Kubernetes API server
      condition: >
        demo_outbound
        and in_demoapp
        and (
          fd.sip = "10.43.0.1"
          or fd.sport in (443, 6443)
        )
      output: "demoapp contacted K8s API (conn=%fd.name proc=%proc.cmdline ns=%k8s.ns.name)"
      priority: NOTICE
      tags: [demo, T1613]